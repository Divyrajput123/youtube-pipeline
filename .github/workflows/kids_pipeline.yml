name: Kids Channel Pipeline

on:
  # Daily at 8 AM IST (2:30 UTC) — kids content performs best in the morning
  schedule:
    - cron: '30 2 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'single'
        type: choice
        options:
          - single
          - resume-all
          - resume-and-generate
      topic:
        description: 'Optional: specific topic to override auto research (e.g. "Five Little Ducks Counting Song"). Leave empty for auto.'
        required: false
        default: ''
        type: string

jobs:
  run-kids-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUNPOD_H3_POD_ID: ${{ secrets.RUNPOD_H3_POD_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyngrok mutagen google-auth google-auth-httplib2

      - name: Create output directories
        run: |
          mkdir -p data/output
          mkdir -p pipeline_output

      - name: Create .env from Kids Channel Secrets
        run: |
          KLING_MODEL_VAL="${{ secrets.KLING_MODEL }}"
          if [ -z "$KLING_MODEL_VAL" ]; then
            KLING_MODEL_VAL="kling-v1-6"
          fi

          {
            echo "PIPELINE_MODE=production"
            echo "VISUAL_PROMPT_MODE=kids_rhyming"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
            echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}"
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
            echo "LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}"
            echo "PERPLEXITY_API_KEY=${{ secrets.PERPLEXITY_API_KEY }}"
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}"
            echo "IDEOGRAM_API_KEY=${{ secrets.IDEOGRAM_API_KEY }}"
            echo "RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY }}"
            echo "RUNPOD_H3_POD_ID=${{ secrets.RUNPOD_H3_POD_ID }}"
            echo "KLING_API_KEY=${{ secrets.KLING_API_KEY }}"
            echo "KLING_MODEL=${KLING_MODEL_VAL}"
            echo "GOOGLE_CLOUD_API_KEY=${{ secrets.KIDS_GOOGLE_CLOUD_API_KEY }}"
            echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
            echo "NGROK_AUTH_TOKEN=${{ secrets.NGROK_AUTH_TOKEN }}"
            echo "NGROK_ENABLED=true"
            echo "REVIEW_SERVER_PORT=8744"
            echo "PIPELINE_PUBLIC_URL=http://localhost:8744"
            echo "NOTION_AUTH_TOKEN=${{ secrets.KIDS_NOTION_AUTH_TOKEN }}"
            echo "NOTION_DATABASE_ID=${{ secrets.KIDS_NOTION_DATABASE_ID }}"
            echo "GOOGLE_CLIENT_ID=${{ secrets.KIDS_GOOGLE_CLIENT_ID }}"
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.KIDS_GOOGLE_CLIENT_SECRET }}"
            echo "GOOGLE_REFRESH_TOKEN=${{ secrets.KIDS_GOOGLE_REFRESH_TOKEN }}"
            echo "GOOGLE_DRIVE_FOLDER_ID=${{ secrets.KIDS_GOOGLE_DRIVE_FOLDER_ID }}"
            echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.KIDS_INSTAGRAM_ACCESS_TOKEN }}"
            echo "INSTAGRAM_ACCOUNT_ID=${{ secrets.KIDS_INSTAGRAM_ACCOUNT_ID }}"
            echo "FACEBOOK_APP_ID=${{ secrets.KIDS_FACEBOOK_APP_ID }}"
            echo "FACEBOOK_APP_SECRET=${{ secrets.KIDS_FACEBOOK_APP_SECRET }}"
            echo "BILIBILI_SESSDATA=${{ secrets.BILIBILI_SESSDATA }}"
            echo "BILIBILI_BILI_JCT=${{ secrets.BILIBILI_BILI_JCT }}"
          } > .env
          echo "✅ Kids channel .env created ($(wc -l < .env) lines)"

      - name: Start MiniMax H3 Pod
        if: env.RUNPOD_H3_POD_ID != ''
        run: |
          echo "🚀 Starting MiniMax H3 Pod for kids channel..."
          PYTHONPATH=src python runpod_server/minimax_h3/pod_manager.py start
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_H3_POD_ID: ${{ secrets.RUNPOD_H3_POD_ID }}

      - name: Run kids pipeline (scheduled)
        if: github.event_name == 'schedule'
        run: |
          echo "🎵 Starting scheduled kids video generation..."
          PYTHONPATH=src python -m pipeline --config config_kids.json --env-file pipeline_output/kidschannel.env
        env:
          PYTHONUNBUFFERED: 1

      - name: Run kids pipeline (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          TOPIC="${{ github.event.inputs.topic }}"
          echo "🎵 Running kids pipeline in mode: $MODE"

          if [ "$MODE" = "resume-all" ]; then
            PYTHONPATH=src python -m pipeline --config config_kids.json --env-file pipeline_output/kidschannel.env --resume-all
          elif [ "$MODE" = "resume-and-generate" ]; then
            if [ -n "$TOPIC" ]; then
              echo "📌 Using forced topic: $TOPIC"
              PYTHONPATH=src python -m pipeline --config config_kids.json --env-file pipeline_output/kidschannel.env --resume-and-generate --topic "$TOPIC"
            else
              PYTHONPATH=src python -m pipeline --config config_kids.json --env-file pipeline_output/kidschannel.env --resume-and-generate
            fi
          else
            if [ -n "$TOPIC" ]; then
              echo "📌 Using forced topic: $TOPIC"
              PYTHONPATH=src python -m pipeline --config config_kids.json --env-file pipeline_output/kidschannel.env --topic "$TOPIC"
            else
              PYTHONPATH=src python -m pipeline --config config_kids.json --env-file pipeline_output/kidschannel.env
            fi
          fi
        env:
          PYTHONUNBUFFERED: 1

      - name: Stop MiniMax H3 Pod (always)
        if: always() && env.RUNPOD_H3_POD_ID != ''
        run: |
          echo "🛑 Stopping H3 Pod..."
          PYTHONPATH=src python runpod_server/minimax_h3/pod_manager.py stop || true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_H3_POD_ID: ${{ secrets.RUNPOD_H3_POD_ID }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kids-pipeline-logs-${{ github.run_id }}
          path: |
            data/output/
            *.log
          retention-days: 7
