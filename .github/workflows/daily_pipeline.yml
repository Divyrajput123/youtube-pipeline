name: Daily YouTube Pipeline

on:
  # Twice daily: 9:00 AM IST and 6:00 PM IST
  schedule:
    - cron: '30 3 * * *'   # 3:30 UTC = 9:00 AM IST
    - cron: '30 12 * * *'  # 12:30 UTC = 6:00 PM IST

  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of videos to generate (1-7)'
        required: false
        default: '1'
        type: string
      mode:
        description: 'Run mode'
        required: false
        default: 'batch'
        type: choice
        options:
          - batch
          - single
          - resume-all
          - resume-and-generate

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub-hosted runner maximum: 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyngrok mutagen google-auth google-auth-httplib2

      - name: Create output directories
        run: |
          mkdir -p data/output
          mkdir -p pipeline_output

      - name: Create .env from GitHub Secrets
        run: |
          cat > .env << EOF
          PIPELINE_MODE=production
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          NOTION_AUTH_TOKEN=${{ secrets.NOTION_AUTH_TOKEN }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          PERPLEXITY_API_KEY=${{ secrets.PERPLEXITY_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER=gemini
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          KLING_API_KEY=${{ secrets.KLING_API_KEY }}
          KLING_MODEL=${{ secrets.KLING_MODEL || 'kling-v1-6' }}
          NGROK_AUTH_TOKEN=${{ secrets.NGROK_AUTH_TOKEN }}
          NGROK_ENABLED=true
          REVIEW_SERVER_PORT=8742
          PIPELINE_PUBLIC_URL=http://localhost:8742
          RUNWAY_API_KEY=${{ secrets.RUNWAY_API_KEY }}
          RUNPOD_ENDPOINT_ID=${{ secrets.RUNPOD_ENDPOINT_ID }}
          RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          EOF
          echo "✅ .env created"

      - name: Run pipeline (scheduled — one video)
        if: github.event_name == 'schedule'
        run: |
          echo "🚀 Starting scheduled generation of one video..."
          PYTHONPATH=src python -m pipeline --config config.json
        env:
          PYTHONUNBUFFERED: 1

      - name: Run pipeline (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          BATCH="${{ github.event.inputs.batch_size }}"
          echo "🚀 Running pipeline in mode: $MODE, batch: $BATCH"

          if [ "$MODE" = "batch" ]; then
            if [ "$BATCH" = "1" ]; then
              # batch-size 1 means single video — skip --batch-size flag
              PYTHONPATH=src python -m pipeline --config config.json
            else
              PYTHONPATH=src python -m pipeline --config config.json --batch-size $BATCH
            fi
          elif [ "$MODE" = "single" ]; then
            PYTHONPATH=src python -m pipeline --config config.json
          elif [ "$MODE" = "resume-all" ]; then
            PYTHONPATH=src python -m pipeline --config config.json --resume-all
          elif [ "$MODE" = "resume-and-generate" ]; then
            PYTHONPATH=src python -m pipeline --config config.json --resume-and-generate
          fi
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload pipeline logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            data/output/
            *.log
          retention-days: 7
