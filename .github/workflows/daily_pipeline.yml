name: Daily YouTube Pipeline

on:
  # Twice daily: 9:00 AM IST and 6:00 PM IST
  schedule:
    - cron: '30 3 * * *'   # 3:30 UTC = 9:00 AM IST
    - cron: '30 12 * * *'  # 12:30 UTC = 6:00 PM IST

  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of videos to generate (1-7)'
        required: false
        default: '1'
        type: string
      mode:
        description: 'Run mode'
        required: false
        default: 'batch'
        type: choice
        options:
          - batch
          - single
          - resume-all
          - resume-and-generate
      visual_prompt_mode:
        description: 'Video style: narration (YouTube essay + TTS voice) or cinematic (screenplay + H3 native voice)'
        required: false
        default: 'narration'
        type: choice
        options:
          - narration
          - cinematic
      topic:
        description: 'Optional: provide a specific topic to override automatic research (e.g. "Why Dune Sandworms Are Unstoppable"). Leave empty for auto.'
        required: false
        default: ''
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours — serial H3 generation: 12 clips × 4 min = ~1hr + overhead
    env:
      # Job-level env so if: conditions can evaluate these before steps run
      RUNPOD_H3_POD_ID: ${{ secrets.RUNPOD_H3_POD_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyngrok mutagen google-auth google-auth-httplib2

      - name: Create output directories
        run: |
          mkdir -p data/output
          mkdir -p pipeline_output

      - name: Create .env from GitHub Secrets
        run: |
          # Determine visual_prompt_mode: manual input overrides config.json default
          VISUAL_MODE="${{ github.event.inputs.visual_prompt_mode }}"
          if [ -z "$VISUAL_MODE" ]; then
            VISUAL_MODE="narration"
          fi
          KLING_MODEL_VAL="${{ secrets.KLING_MODEL }}"
          if [ -z "$KLING_MODEL_VAL" ]; then
            KLING_MODEL_VAL="kling-v1-6"
          fi
          echo "📺 Visual prompt mode: $VISUAL_MODE"

          # Write .env line by line — no heredoc indentation issues, no sed needed
          {
            echo "PIPELINE_MODE=production"
            echo "VISUAL_PROMPT_MODE=${VISUAL_MODE}"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
            echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}"
            echo "NOTION_AUTH_TOKEN=${{ secrets.NOTION_AUTH_TOKEN }}"
            echo "NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}"
            echo "PERPLEXITY_API_KEY=${{ secrets.PERPLEXITY_API_KEY }}"
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}"
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
            echo "LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}"
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
            echo "GOOGLE_REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}"
            echo "GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}"
            echo "KLING_API_KEY=${{ secrets.KLING_API_KEY }}"
            echo "KLING_MODEL=${KLING_MODEL_VAL}"
            echo "IDEOGRAM_API_KEY=${{ secrets.IDEOGRAM_API_KEY }}"
            echo "NGROK_AUTH_TOKEN=${{ secrets.NGROK_AUTH_TOKEN }}"
            echo "NGROK_ENABLED=true"
            echo "REVIEW_SERVER_PORT=8742"
            echo "PIPELINE_PUBLIC_URL=http://localhost:8742"
            echo "RUNWAY_API_KEY=${{ secrets.RUNWAY_API_KEY }}"
            echo "RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY }}"
            echo "RUNPOD_H3_POD_ID=${{ secrets.RUNPOD_H3_POD_ID }}"
            echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
            echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}"
            echo "INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}"
            echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}"
            echo "FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}"
            echo "GOOGLE_CLOUD_API_KEY=${{ secrets.GOOGLE_CLOUD_API_KEY }}"
          } > .env
          echo "✅ .env created ($(wc -l < .env) lines)"
          grep -c "GOOGLE_CLOUD_API_KEY" .env && echo "GOOGLE_CLOUD_API_KEY present"

      - name: Start MiniMax H3 Pod (if using minimax_h3 provider)
        if: env.RUNPOD_H3_POD_ID != ''
        run: |
          echo "🚀 Starting MiniMax H3 ComfyUI Pod (will retry up to 30 min if GPU unavailable)..."
          PYTHONPATH=src python runpod_server/minimax_h3/pod_manager.py start
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_H3_POD_ID: ${{ secrets.RUNPOD_H3_POD_ID }}

      - name: Run pipeline (scheduled — one video)
        if: github.event_name == 'schedule'
        run: |
          echo "🚀 Starting scheduled generation of one video..."
          PYTHONPATH=src python -m pipeline --config config.json
        env:
          PYTHONUNBUFFERED: 1

      - name: Run pipeline (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          BATCH="${{ github.event.inputs.batch_size }}"
          TOPIC="${{ github.event.inputs.topic }}"
          echo "🚀 Running pipeline in mode: $MODE, batch: $BATCH"

          # Build optional --topic flag
          TOPIC_FLAG=""
          if [ -n "$TOPIC" ]; then
            TOPIC_FLAG="--topic \"$TOPIC\""
            echo "📌 Using forced topic: $TOPIC"
          fi

          if [ "$MODE" = "batch" ]; then
            if [ "$BATCH" = "1" ]; then
              eval PYTHONPATH=src python -m pipeline --config config.json $TOPIC_FLAG
            else
              PYTHONPATH=src python -m pipeline --config config.json --batch-size $BATCH
            fi
          elif [ "$MODE" = "single" ]; then
            eval PYTHONPATH=src python -m pipeline --config config.json $TOPIC_FLAG
          elif [ "$MODE" = "resume-all" ]; then
            PYTHONPATH=src python -m pipeline --config config.json --resume-all
          elif [ "$MODE" = "resume-and-generate" ]; then
            eval PYTHONPATH=src python -m pipeline --config config.json --resume-and-generate $TOPIC_FLAG
          fi
        env:
          PYTHONUNBUFFERED: 1

      - name: Stop MiniMax H3 Pod (always, even on failure)
        if: always() && env.RUNPOD_H3_POD_ID != ''
        run: |
          echo "🛑 Stopping MiniMax H3 Pod..."
          PYTHONPATH=src python runpod_server/minimax_h3/pod_manager.py stop || true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_H3_POD_ID: ${{ secrets.RUNPOD_H3_POD_ID }}

      - name: Upload pipeline logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            data/output/
            *.log
          retention-days: 7
