name: Instagram Reel Manager

on:
  # Daily at 6 PM IST (12:30 UTC) — posts 1 Reel automatically
  schedule:
    - cron: '30 12 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: daily (auto 1/day), publish (specific video), test'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - publish
          - test
      video_id:
        description: 'Video ID (required for publish mode, e.g. video-d10bd04d)'
        required: false
        default: ''
        type: string

jobs:
  instagram-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -e .

      - name: Create .env from GitHub Secrets
        run: |
          cat > .env <<EOF
          PIPELINE_MODE=production
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_CLOUD_API_KEY=${{ secrets.GOOGLE_CLOUD_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}
          NOTION_AUTH_TOKEN=${{ secrets.NOTION_AUTH_TOKEN }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF
          sed -i 's/^[[:space:]]*//' .env
          echo "✅ .env created"

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=daily" >> $GITHUB_OUTPUT
            echo "video_id=" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "video_id=${{ github.event.inputs.video_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Instagram Reel Manager
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          VIDEO_ID="${{ steps.mode.outputs.video_id }}"
          echo "Mode: $MODE, Video ID: $VIDEO_ID"
          if [ "$MODE" = "publish" ] && [ -n "$VIDEO_ID" ]; then
            PYTHONPATH=src python scripts/instagram_reel_manager.py --mode publish --video-id "$VIDEO_ID"
          else
            PYTHONPATH=src python scripts/instagram_reel_manager.py --mode "$MODE"
          fi
        env:
          PYTHONUNBUFFERED: 1
