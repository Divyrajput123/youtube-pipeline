name: Instagram Reel Manager

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: test (single test) or publish (post Reel for a specific video)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - publish
      video_id:
        description: 'Video ID to create Reel for (required for publish mode, e.g. video-d10bd04d)'
        required: false
        default: ''
        type: string

jobs:
  instagram-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: pip install -e .

      - name: Create .env from GitHub Secrets
        run: |
          cat > .env <<EOF
          PIPELINE_MODE=production
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_CLOUD_API_KEY=${{ secrets.GOOGLE_CLOUD_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}
          NOTION_AUTH_TOKEN=${{ secrets.NOTION_AUTH_TOKEN }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF
          sed -i 's/^[[:space:]]*//' .env
          echo "✅ .env created"

      - name: Run Instagram Reel (${{ github.event.inputs.mode }})
        run: |
          PYTHONPATH=src python scripts/instagram_reel_manager.py --mode ${{ github.event.inputs.mode }} --video-id "${{ github.event.inputs.video_id }}"
        env:
          PYTHONUNBUFFERED: 1
